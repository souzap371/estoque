name: sistema-v

services:
  aplicacao:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8383}:8383"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-estoque}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      JARVIT_OPENAI_API_KEY: ${JARVIT_OPENAI_API_KEY:?Defina JARVIT_OPENAI_API_KEY no arquivo .env}
      JARVIT_OPENAI_MODEL: ${JARVIT_OPENAI_MODEL:-gpt-5.6-terra}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - sistema_v

volumes:
  uploads_data:
  logs_data:

networks:
  sistema_v:
    driver: bridge
