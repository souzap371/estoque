spring.application.name=estoque
spring.config.import=optional:file:.env[.properties]

# ===============================
# 🔴 DESATIVANDO H2
# ===============================
# spring.datasource.url=jdbc:h2:file:./data/estoque-db
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===============================
# 🐘 CONFIGURAÇÃO DO POSTGRESQL
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/estoque}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# 🧠 JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# 🚫 DESATIVAR H2 CONSOLE
# ===============================
spring.h2.console.enabled=false



# ===============================
# LIMITE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
spring.thymeleaf.cache=false
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo


logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR
logging.level.org.thymeleaf=TRACE
logging.file.name=logs/estoque.log
# logging.level.root=ROOT
logging.level.com.expedicao=DEBUG


# =====ACTUATOR http://localhost:8080/actuator/logfile
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

spring.mvc.locale=pt_BR
spring.mvc.locale-resolver=fixed







# ===============================
# 🌐 PORTA (opcional)
# ===============================
server.port=8383

# ===============================
# JARVIT IA
# A chave deve ser configurada somente pela variável de ambiente.
# ===============================
jarvit.openai.api-key=${JARVIT_OPENAI_API_KEY:}
jarvit.openai.model=${JARVIT_OPENAI_MODEL:gpt-5.6-terra}


