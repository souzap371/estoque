<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Pedido / Venda</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* (mantive seu CSS igual) */
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', system-ui, Arial, sans-serif;
            background: linear-gradient(135deg, #0d6efd, #1e40af);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px
        }

        .container {
            width: 100%;
            max-width: 960px;
            background: #fff;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, .2)
        }

        h2 {
            text-align: center;
            margin-bottom: 28px;
            font-size: 20px;
            font-weight: 600
        }

        label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            display: block
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-bottom: 16px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px
        }

        .flex {
            display: flex;
            gap: 20px;
            align-items: center
        }

        hr {
            margin: 20px 0;
            border: none;
            border-top: 1px solid #e2e8f0
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer
        }

        .btn-add {
            background: #2563eb;
            color: #fff
        }

        .btn-finish {
            background: #16a34a;
            color: #fff
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: center
        }

        th {
            background: #f1f5f9
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 26px
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 th:text="${vendaId != null} ? '✏ Editar Venda' : '🛒 Nova Venda'"></h2>

        <div class="grid">
            <div>
                <label>Nome do Cliente</label>
                <input id="clienteNome" th:value="${clienteNomeEdicao}">
            </div>
            <div>
                <label>Estado do Cliente</label>
                <select id="clienteEstado">
                    <option value="">Selecione</option>
                    <option
                        th:each="uf : ${T(java.util.List).of('AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO')}"
                        th:value="${uf}" th:text="${uf}" th:selected="${uf == clienteEstadoEdicao}">
                    </option>
                </select>
                <!-- <input type="date" id="dataPedido"> -->
            </div>
            <div>
                <label>Data do Pedido</label>
                <input type="date" id="dataPedido" th:value="${#temporals.format(dataPedidoEdicao, 'yyyy-MM-dd')}">
            </div>
            <div>
                <label>Nota Fiscal</label>
                <div class="flex">
                    <label>
                        <input type="radio" name="notaFiscal" value="true" checked>
                        C/NF
                    </label>

                    <label>
                        <input type="radio" name="notaFiscal" value="false">
                        S/NF
                    </label>
                </div>
            </div>
        </div>

        <hr>

        <div class="grid">
            <div>
                <label>Produto</label>
                <select id="produto">
                    <option value="">Selecione</option>
                    <option th:each="p : ${produtos}" th:value="${p.codigo}" th:text="${p.nome}"></option>
                </select>
            </div>
            <div>
                <label>Quantidade</label>
                <input type="number" id="quantidade" min="1">
            </div>
            <div>
                <label>Valor por Caixa</label>
                <input type="number" step="0.01" id="valor">
            </div>
        </div>

        <div class="grid">
            <div>
                <label>Tipo do Item</label>
                <div class="flex">
                    <label><input type="radio" name="tipoItem" value="V" checked> Venda</label>
                    <label><input type="radio" name="tipoItem" value="T"> Transferência</label>
                </div>
            </div>
            <div id="estadoDestinoDiv" style="display:none;">
                <label>Estado Destino</label>
                <select id="estadoDestino">
                    <option value="">Selecione</option>
                    <option value="MG">MG</option>
                    <option value="AL">AL</option>
                </select>
            </div>
        </div>

        <button class="btn-add" type="button" onclick="adicionarItem()">➕ Adicionar Produto</button>

        <table>


            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Qtd</th>
                    <th>Valor</th>
                    <th>Tipo</th>
                    <th>Destino</th>
                    <th>Subtotal</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="itens"></tbody>
        </table>

        <h3 id="total">TOTAL: R$ 0,00</h3>

        <div class="actions">
            <button onclick="window.location.href='/dashboard'">Voltar</button>
            <button class="btn-finish" onclick="concluirPedido()">✅ Concluir Pedido</button>
        </div>
    </div>

    <script th:inline="javascript">
        const vendaId = /*[[${vendaId}]]*/ null;
        const vendaEdicao = vendaId !== null;

        const clienteNomeBackend = /*[[${clienteNomeEdicao}]]*/ "";
        const clienteEstadoBackend = /*[[${clienteEstadoEdicao}]]*/ "";
        const itensBackend = /*[[${itensEdicao}]]*/[];

        const salvarUrl = /*[[@{/vendas/salvar}]]*/ "/vendas/salvar";

        let itens = [];
        let total = 0;

        const moedaBR = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);

        const produtoInput = document.getElementById("produto");
        const quantidade = document.getElementById("quantidade");
        const valorInput = document.getElementById("valor");
        const estadoDestinoSelect = document.getElementById("estadoDestino");
        const totalLabel = document.getElementById("total");
        const clienteNome = document.getElementById("clienteNome");
        const clienteEstado = document.getElementById("clienteEstado");

        window.adicionarItem = function () {
            const produto = produtoInput.value;
            const qtd = parseInt(quantidade.value);
            const valor = parseFloat(valorInput.value);
            const tipo = document.querySelector("input[name='tipoItem']:checked").value;
            const estadoDestino = estadoDestinoSelect.value;

            if (!produto || !qtd || !valor) return alert("Preencha os dados do produto");
            if (tipo === "T" && !estadoDestino) return alert("Informe o estado de destino");

            const subtotal = qtd * valor;
            total += subtotal;

            itens.push({
                codigoOuNome: produto,
                quantidade: qtd,
                valorPorCaixa: valor,
                tipoMovimentacao: tipo,
                estadoDestino
            });

            renderTabela();

            produtoInput.value = quantidade.value = valorInput.value = "";

            const tr = document.createElement("tr");
            tr.innerHTML =
                "<td>" + produto + "</td>" +
                "<td>" + qtd + "</td>" +
                "<td>" + moedaBR(valor) + "</td>" +
                "<td>" + tipo + "</td>" +
                "<td>" + (tipo === "T" ? estadoDestino : "-") + "</td>" +
                "<td>" + moedaBR(subtotal) + "</td>";

            document.getElementById("itens").appendChild(tr);

            totalLabel.innerText = "TOTAL: " + moedaBR(total);
            produtoInput.value = quantidade.value = valorInput.value = "";
        };

        function atualizarCampoDestino() {
            const selecionado = document.querySelector("input[name='tipoItem']:checked");
            const divDestino = document.getElementById("estadoDestinoDiv");

            if (!selecionado) {
                divDestino.style.display = "none";
                return;
            }

            divDestino.style.display = selecionado.value === "T" ? "block" : "none";
        }


        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll("input[name='tipoItem']").forEach(radio => {
                radio.addEventListener("change", atualizarCampoDestino);
            });

            atualizarCampoDestino();
        });

        function renderTabela() {
            const tbody = document.getElementById("itens");
            tbody.innerHTML = "";
            total = 0;

            itens.forEach((item, index) => {
                const subtotal = item.quantidade * item.valorPorCaixa;
                total += subtotal;

                const tr = document.createElement("tr");

                tr.innerHTML = `
            <td>${item.codigoOuNome}</td>
            <td>${item.quantidade}</td>
            <td>${moedaBR(item.valorPorCaixa)}</td>
            <td>${item.tipoMovimentacao}</td>
            <td>${item.tipoMovimentacao === 'T' ? item.estadoDestino : '-'}</td>
            <td>${moedaBR(subtotal)}</td>
            <td>
                <button onclick="editarItem(${index})">✏</button>
                <button onclick="excluirItem(${index})">🗑</button>
            </td>
        `;

                tbody.appendChild(tr);
            });

            totalLabel.innerText = "TOTAL: " + moedaBR(total);
        }


        function editarItem(index) {
            const item = itens[index];
            const tbody = document.getElementById("itens");
            const tr = tbody.children[index];

            tr.innerHTML = `
        <td><input value="${item.codigoOuNome}" disabled></td>
        <td><input type="number" id="qtdEdit" value="${item.quantidade}"></td>
        <td><input type="number" step="0.01" id="valorEdit" value="${item.valorPorCaixa}"></td>
        <td>
            <select id="tipoEdit">
                <option value="V" ${item.tipoMovimentacao === 'V' ? 'selected' : ''}>Venda</option>
                <option value="T" ${item.tipoMovimentacao === 'T' ? 'selected' : ''}>Transferência</option>
            </select>
        </td>
        <td>
            <input id="destinoEdit" value="${item.estadoDestino || ''}">
        </td>
        <td>-</td>
        <td>
            <button onclick="salvarEdicao(${index})">💾</button>
            <button onclick="renderTabela()">❌</button>
        </td>
    `;
        }

        function concluirPedido() {

            if (!Array.isArray(itens) || itens.length === 0) {
                alert("Nenhum item adicionado ao pedido");
                return;
            }
            const comNotaFiscal =
                document.querySelector("input[name='notaFiscal']:checked").value === "true";

            const dataPedido = document.getElementById("dataPedido");

            const payload = {
                id: vendaId,
                clienteNome: clienteNome.value,
                clienteEstado: clienteEstado.value,
                comNotaFiscal: comNotaFiscal,
                dataPedido: dataPedido.value,
                itens: itens
            };

            console.log("Payload enviado:", payload);

            fetch(salvarUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
                .then(resp => {
                    if (!resp.ok) throw new Error("Erro ao salvar venda");
                    return resp.text();
                })
                .then(() => {
                    alert("Venda salva com sucesso!");
                    window.location.href = "/relatorios/vendas";
                })
                .catch(err => {
                    console.error(err);
                    alert("Erro ao concluir pedido");
                });
        }




        // 🔵 MODO EDIÇÃO
        if (vendaEdicao) {
            clienteNome.value = clienteNomeBackend;
            clienteEstado.value = clienteEstadoBackend;

            itensBackend.forEach(i => {
                itens.push({
                    codigoOuNome: i.produtoCodigo,

                    quantidade: i.quantidade,
                    valorPorCaixa: i.valorPorCaixa,
                    tipoMovimentacao: i.tipoMovimentacao,
                    estadoDestino: i.estadoDestino
                });
            });

            renderTabela();
        }


        function salvarEdicao(index) {
            itens[index].quantidade = parseInt(document.getElementById("qtdEdit").value);
            itens[index].valorPorCaixa = parseFloat(document.getElementById("valorEdit").value);
            itens[index].tipoMovimentacao = document.getElementById("tipoEdit").value;
            itens[index].estadoDestino = document.getElementById("destinoEdit").value;

            renderTabela();
        }


        function excluirItem(index) {
            if (!confirm("Deseja remover este item?")) return;
            itens.splice(index, 1);
            renderTabela();
        }

    </script>


</body>

</html>
