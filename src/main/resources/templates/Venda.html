<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Pedido / Venda</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', system-ui, Arial, sans-serif;
            background: linear-gradient(135deg, #0d6efd, #1e40af);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 960px;
            background: #fff;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 28px;
            font-size: 20px;
            font-weight: 600;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .flex {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        hr {
            margin: 20px 0;
            border: none;
            border-top: 1px solid #e2e8f0;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-add {
            background: #2563eb;
            color: #fff;
        }

        .btn-finish {
            background: #16a34a;
            color: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: center;
        }

        th {
            background: #f1f5f9;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 26px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Pedido / Venda</h2>


        <div class="grid">
            <div>
                <label>Nome do Cliente</label>
                <input id="clienteNome">
            </div>
            <div>
                <label>Estado do Cliente</label>
                <select id="clienteEstado">
                    <option value="">Selecione</option>
                    <option value="AC">AC</option>
                    <option value="AL">AL</option>
                    <option value="AP">AP</option>
                    <option value="AM">AM</option>
                    <option value="BA">BA</option>
                    <option value="CE">CE</option>
                    <option value="DF">DF</option>
                    <option value="ES">ES</option>
                    <option value="GO">GO</option>
                    <option value="MA">MA</option>
                    <option value="MT">MT</option>
                    <option value="MS">MS</option>
                    <option value="MG">MG</option>
                    <option value="PA">PA</option>
                    <option value="PB">PB</option>
                    <option value="PR">PR</option>
                    <option value="PE">PE</option>
                    <option value="PI">PI</option>
                    <option value="RJ">RJ</option>
                    <option value="RN">RN</option>
                    <option value="RS">RS</option>
                    <option value="RO">RO</option>
                    <option value="RR">RR</option>
                    <option value="SC">SC</option>
                    <option value="SP">SP</option>
                    <option value="SE">SE</option>
                    <option value="TO">TO</option>
                </select>
            </div>
        </div>

        <hr>

        <div class="grid">

            <div>
                <label>Produto</label>
                <select id="produto">
                    <option value="">Selecione um produto</option>
                    <option th:each="p : ${produtos}" th:value="${p.codigo}" th:text="${p.nome}">
                    </option>
                </select>
            </div>
            <div>
                <label>Quantidade</label>
                <input type="number" id="quantidade" min="1">
            </div>
            <div>
                <label>Valor por Caixa</label>
                <input type="number" step="0.01" id="valor">
            </div>
        </div>

        <div class="grid">
            <div>
                <label>Tipo do Item</label>
                <div class="flex">
                    <label><input type="radio" name="tipoItem" value="V" checked> Venda</label>
                    <label><input type="radio" name="tipoItem" value="T"> Transferência</label>
                </div>
            </div>

            <div id="estadoDestinoDiv" style="display:none;">
                <label>Estado Destino</label>
                <select id="estadoDestino">
                    <option value="">Selecione</option>
                    <option value="MG">MG</option>
                    <option value="AL">AL</option>
                </select>
            </div>
        </div>

        <button class="btn-add" type="button" onclick="adicionarItem()">➕ Adicionar Produto</button>

        <table>
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Qtd</th>
                    <th>Valor</th>
                    <th>Tipo</th>
                    <th>Destino</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody id="itens"></tbody>
        </table>

        <h3 id="total">TOTAL: R$ 0,00</h3>

        <div class="actions">
            <button onclick="window.location.href='/dashboard'">Voltar</button>
            <button class="btn-finish" onclick="concluirPedido()">✅ Concluir Pedido</button>
        </div>
    </div>

    <script>
        let itens = [];
        let total = 0;

        const moedaBR = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);

        document.querySelectorAll("input[name='tipoItem']").forEach(radio => {
            radio.addEventListener("change", () => {
                const tipo = document.querySelector("input[name='tipoItem']:checked").value;
                document.getElementById("estadoDestinoDiv").style.display = tipo === "T" ? "block" : "none";
            });
        });

        function adicionarItem() {
            const produto = produtoInput.value;
            const qtd = parseInt(quantidade.value);
            const valor = parseFloat(valorInput.value);
            const tipo = document.querySelector("input[name='tipoItem']:checked").value;
            const estadoDestino = estadoDestinoSelect.value;

            if (!produto || !qtd || !valor) return alert("Preencha os dados do produto");

            if (tipo === "T" && !estadoDestino)
                return alert("Informe o estado de destino para transferência");

            const subtotal = qtd * valor;
            total += subtotal;

            itens.push({
                codigoOuNome: produto,
                quantidade: qtd,
                valorPorCaixa: valor,
                tipoMovimentacao: tipo,
                estadoDestino: tipo === "T" ? estadoDestino : null
            });

            const tr = document.createElement("tr");
            tr.innerHTML = `
            <td>${produto}</td>
            <td>${qtd}</td>
            <td>${moedaBR(valor)}</td>
            <td>${tipo}</td>
            <td>${tipo === "T" ? estadoDestino : "-"}</td>
            <td>${moedaBR(subtotal)}</td>
        `;
            document.getElementById("itens").appendChild(tr);

            totalLabel.innerText = "TOTAL: " + moedaBR(total);
            produtoInput.value = quantidade.value = valorInput.value = "";
        }

        function concluirPedido() {
            fetch("[[@{/vendas/salvar}]]", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    clienteNome: clienteNome.value,
                    clienteEstado: clienteEstado.value,
                    itens: itens
                })
            }).then(() => location.reload());
        }

        const produtoInput = document.getElementById("produto");
        const quantidade = document.getElementById("quantidade");
        const valorInput = document.getElementById("valor");
        const estadoDestinoSelect = document.getElementById("estadoDestino");
        const totalLabel = document.getElementById("total");
    </script>
</body>

</html>
