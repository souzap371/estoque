<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>BI Financeiro</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            margin: 0;
        }

        .container {
            width: 95%;
            margin: 30px auto;
        }

        h1 {
            color: #1e88e5;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            margin: 0;
            color: #555;
        }

        .valor {
            margin-top: 15px;
            font-size: 28px;
            font-weight: bold;
            color: #1e88e5;
        }

        .grafico {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin-top: 25px;
        }

        .acoes {
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 15px;
            background: #1e88e5;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 10px;
        }

        .btn-excel {
            background: #2e7d32;
            color: white;
            padding: 10px 18px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-pdf {
            background: #c62828;
            color: white;
            padding: 10px 18px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>📊 BI Financeiro</h1>

        <!-- FILTROS -->
        <div style="
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:25px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
">

            <form method="get" action="/financeiro/relatorios">

                <div style="
            display:grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            gap:15px;
            align-items:end;
        ">

                    <!-- FORNECEDOR -->
                    <div>

                        <label><strong>Fornecedor</strong></label><br>

                        <select name="fornecedorId" style="
                    width:100%;
                    padding:10px;
                    border:1px solid #ccc;
                    border-radius:5px;
                ">

                            <option value="">TODOS</option>

                            <option th:each="f : ${fornecedores}" th:value="${f.id}" th:text="${f.razaoSocial}"
                                th:selected="${fornecedorId == f.id}">
                            </option>

                        </select>

                    </div>

                    <!-- DATA INICIO -->
                    <div>

                        <label><strong>Período Inicial</strong></label><br>

                        <input type="date" name="dataInicio" th:value="${dataInicio}" style="
                        width:100%;
                        padding:10px;
                        border:1px solid #ccc;
                        border-radius:5px;
                       ">

                    </div>

                    <!-- DATA FIM -->
                    <div>

                        <label><strong>Período Final</strong></label><br>

                        <input type="date" name="dataFim" th:value="${dataFim}" style="
                        width:100%;
                        padding:10px;
                        border:1px solid #ccc;
                        border-radius:5px;
                       ">

                    </div>

                    <!-- BOTÃO -->
                    <div>

                        <button type="submit" class="btn" style="
                    width:100%;
                    height:42px;
                    border:none;
                ">

                            🔍 Filtrar

                        </button>

                    </div>

                </div>

            </form>

        </div>

        <div style="margin-bottom:20px;">

            <a href="/dashboard" style="
            display:inline-block;
            padding:10px 18px;
            background:#1e88e5;
            color:white;
            text-decoration:none;
            border-radius:5px;
            font-weight:bold;
       ">

                ⬅ Voltar Menu inicial

            </a>

        </div>

        <div class="acoes">

            <a href="/financeiro/exportar/pdf" class="btn-pdf">
                📄 Exportar PDF
            </a>

            <a href="/financeiro/exportar/excel" class="btn-excel">
                📊 Exportar Excel
            </a>

        </div>

        <div class="cards">

            <div class="card">

                <h2>Total em Aberto</h2>

                <div class="valor">

                    R$:
                    <span th:text="${#numbers.formatDecimal(totalPagar,1,'POINT',2,'COMMA')}"></span>

                </div>

            </div>

            <div class="card">

                <h2>Total Pago</h2>

                <div class="valor">

                    R$:
                    <span th:text="${#numbers.formatDecimal(totalPago,1,'POINT',2,'COMMA')}"></span>

                </div>

            </div>

            <div class="card">

                <h2>Total Atrasado</h2>

                <div class="valor">

                    R$:
                    <span th:text="${#numbers.formatDecimal(totalAtrasado,1,'POINT',2,'COMMA')}"></span>

                </div>

            </div>

            <div class="card">

                <h2>Contas Pendentes</h2>

                <div class="valor" th:text="${quantidadePendentes}">
                </div>

            </div>
            <div class="card">

                <h2>⚠ Vencendo na Semana</h2>

                <div class="valor" th:text="${contasSemana}">
                </div>

            </div>

        </div>

        <div class="grafico">

            <h2>Pagamentos Mensais</h2>

            <canvas id="graficoPagamentos"></canvas>

        </div>

    </div>

    <script th:inline="javascript">

        let pagamentos = /*[[${pagamentosMensais}]]*/ {};

        let labels = Object.keys(pagamentos);

        let valores = Object.values(pagamentos);

        new Chart(
            document.getElementById('graficoPagamentos'),
            {
                type: 'bar',

                data: {

                    labels: labels,

                    datasets: [{

                        label: 'Pagamentos',

                        data: valores

                    }]
                },

                options: {

                    responsive: true,

                    plugins: {

                        legend: {
                            display: true
                        }

                    }

                }
            }
        );

    </script>

</body>

</html>
