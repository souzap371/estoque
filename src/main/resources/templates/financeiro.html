<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Financeiro</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
    }

    h1 {
      color: #1e88e5;
    }

    .container {
      width: 95%;
      margin: 30px auto;
    }

    .filtros {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    select,
    button {
      padding: 8px;
      font-size: 14px;
    }

    button {
      background: #1e88e5;
      color: #fff;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background: #1565c0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #1e88e5;
      color: #fff;
    }

    .aberto {
      color: red;
      font-weight: bold;
    }

    .quitado {
      color: green;
      font-weight: bold;
    }

    .totais {
      display: flex;
      gap: 20px;
      margin: 15px 0;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>💰 Financeiro - Contas a Receber</h1>

    <div class="filtros">
      <select id="cliente">
        <option value="TODOS">Todos Clientes</option>
      </select>

      <select id="status">
        <option value="TODOS">Todos Status</option>
        <option value="ABERTO">Em Aberto</option>
        <option value="QUITADO">Quitado</option>
      </select>

      <button onclick="carregarFinanceiro()">Filtrar</button>
    </div>

    <div class="totais">
      <div>💳 Débito Total: <span id="totalDebito">R$ 0,00</span></div>
      <div>✅ Valor Pago: <span id="totalPago">R$ 0,00</span></div>
      <div>📌 Saldo Restante: <span id="totalSaldo">R$ 0,00</span></div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Débito Total</th>
          <th>Valor Pago</th>
          <th>Saldo Restante</th>
          <th>Status</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <div style="margin-top:20px;">
      <button onclick="window.location.href='/dashboard'">Voltar</button>
    </div>

  </div>

  <script>

    // ============================
    // CARREGAR CLIENTES
    // ============================
    function carregarClientes() {
      fetch('/financeiro/api/clientes')
        .then(res => res.json())
        .then(clientes => {

          const select = document.getElementById('cliente');
          select.innerHTML = '<option value="TODOS">Todos Clientes</option>';

          clientes.forEach(nome => {
            const opt = document.createElement('option');
            opt.value = nome;
            opt.textContent = nome;
            select.appendChild(opt);
          });

          // 🔥 Agora carrega todos os dados automaticamente
          carregarFinanceiro();
        })
        .catch(err => console.error("Erro ao carregar clientes:", err));
    }

    // ============================
    // CARREGAR FINANCEIRO
    // ============================
    function carregarFinanceiro() {

      const cliente = document.getElementById('cliente').value;
      const status = document.getElementById('status').value;

      let url = `/financeiro/api/filtrar?`;

      if (cliente !== "TODOS") {
        url += `cliente=${encodeURIComponent(cliente)}&`;
      }

      if (status !== "TODOS") {
        url += `status=${status}`;
      }

      fetch(url)
        .then(res => res.json())
        .then(dados => {

          const tbody = document.getElementById('tbody');
          tbody.innerHTML = '';

          let totalDebito = 0;
          let totalPago = 0;
          let totalSaldo = 0;

          dados.forEach(c => {

            totalDebito += Number(c.valorOriginal);
            totalPago += Number(c.valorPago);
            totalSaldo += Number(c.saldoDevedor);

            const statusTexto = c.saldoDevedor > 0 ? "ABERTO" : "QUITADO";

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${c.clienteNome}</td>
              <td>${formatarMoeda(c.valorOriginal)}</td>
              <td>${formatarMoeda(c.valorPago)}</td>
              <td>${formatarMoeda(c.saldoDevedor)}</td>

              <td class="${statusTexto === 'ABERTO' ? 'aberto' : 'quitado'}">
                ${statusTexto}
              </td>

              <td>
                ${statusTexto === "ABERTO"
                ? `<button onclick="window.location.href='/financeiro/baixar/${c.id}'">
                      Dar Baixa
                    </button>`
                : ""}
              </td>
            `;

            tbody.appendChild(tr);
          });

          document.getElementById("totalDebito").innerText = formatarMoeda(totalDebito);
          document.getElementById("totalPago").innerText = formatarMoeda(totalPago);
          document.getElementById("totalSaldo").innerText = formatarMoeda(totalSaldo);

        })
        .catch(err => console.error("Erro ao carregar financeiro:", err));
    }

    function formatarMoeda(valor) {
      return Number(valor).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    // 🚀 CARREGA AUTOMATICAMENTE AO ABRIR
    document.addEventListener("DOMContentLoaded", carregarClientes);

  </script>

</body>

</html>
