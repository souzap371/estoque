<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Relatório Financeiro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
    }

    h2 {
      color: #1e88e5;
      text-align: left;
    }

    .container {
      width: 95%;
      margin: 30px auto;
    }

    .filtros {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    select,
    button {
      padding: 8px;
      font-size: 14px;
    }

    button {
      background: #1e88e5;
      color: #fff;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background: #1565c0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #1e88e5;
      color: #fff;
    }

    .aberto {
      color: red;
      font-weight: bold;
    }

    .quitado {
      color: green;
      font-weight: bold;
    }

    .totais {
      display: flex;
      gap: 20px;
      margin: 15px 0;
      font-weight: bold;
    }

    .excluir-btn {
      background: red;
    }
  </style>

</head>

<body>


  <div class="container">
    <h2>📊 Relatório Financeiro</h2>

    <div class="filtros">
      <select id="status">
        <option value="">Todos Status</option>
        <option value="ABERTO">Em Aberto</option>
        <option value="QUITADO">Quitado</option>
      </select>

      <select id="cliente">
        <option value="">Todos Clientes</option>
      </select>


      <select id="formaPagamento">
        <option value="">Todas Formas</option>
      </select>


      <button class="filtrar-btn" onclick="carregarRelatorio()">Filtrar</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Valor Original</th>
          <th>Valor Pago</th>
          <th>Saldo</th>
          <th>Status</th>
          <th>Valor Baixa</th>
          <th>Data Pagamento</th>
          <th>Forma</th>
          <th>Anexo</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tbody">
      </tbody>
    </table>

    <script>

      function formatarMoeda(valor) {
        return valor
          ? valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
          : 'R$ 0,00';
      }

      function formatarDataBR(dataIso) {
        if (!dataIso) return '-';
        const data = new Date(dataIso);
        return data.toLocaleDateString('pt-BR');
      }

      function carregarClientes() {
        fetch('/financeiro/api/clientes')
          .then(res => {
            if (!res.ok) throw new Error("Erro ao buscar clientes");
            return res.json();
          })
          .then(clientes => {

            const select = document.getElementById('cliente');
            select.innerHTML = '<option value="">Todos Clientes</option>';

            clientes.forEach(nome => {
              const opt = document.createElement('option');
              opt.value = nome;
              opt.textContent = nome;
              select.appendChild(opt);
            });

          })
          .catch(err => {
            console.error("Erro ao carregar clientes:", err);
          });
      }


      function carregarRelatorio() {

        const status = document.getElementById('status').value;
        const cliente = document.getElementById('cliente').value;
        const formaPagamento = document.getElementById('formaPagamento').value;

        let url = '/financeiro/api/relatorio?';

        if (status) url += 'status=' + status + '&';
        if (cliente) url += 'cliente=' + cliente + '&';
        if (formaPagamento) url += 'formaPagamento=' + formaPagamento + '&';

        fetch(url)
          .then(res => res.json())
          .then(dados => {

            const tbody = document.getElementById('tbody');
            tbody.innerHTML = '';

            dados.forEach(c => {

              const statusTxt = c.saldoDevedor > 0 ? 'ABERTO' : 'QUITADO';

              if (c.pagamentos && c.pagamentos.length > 0) {

                c.pagamentos.forEach(p => {

                  const tr = document.createElement('tr');

                  tr.innerHTML = `
                        <td>${c.clienteNome}</td>
                        <td>${formatarMoeda(c.valorOriginal)}</td>
                        <td>${formatarMoeda(c.valorPago)}</td>
                        <td>${formatarMoeda(c.saldoDevedor)}</td>
                        <td class="${statusTxt === 'ABERTO' ? 'aberto' : 'quitado'}">${statusTxt}</td>
                        <td>${formatarMoeda(p.valorPago)}</td>
                        <td>${formatarDataBR(p.dataPagamento)}</td>
                        <td>${p.formaPagamento || '-'}</td>
                        <td>
                            ${p.anexoPath
                      ? `<a href="/financeiro/api/pagamento/anexo/${p.id}" target="_blank">📎 Baixar</a>`
                      : '-'}
                        </td>
                        <td>
                            <button class="excluir-btn" onclick="excluirBaixa(${p.id})">
                                Excluir
                            </button>
                        </td>
                    `;

                  tbody.appendChild(tr);
                });

              } else {

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${c.clienteNome}</td>
                    <td>${formatarMoeda(c.valorOriginal)}</td>
                    <td>${formatarMoeda(c.valorPago)}</td>
                    <td>${formatarMoeda(c.saldoDevedor)}</td>
                    <td class="${statusTxt === 'ABERTO' ? 'aberto' : 'quitado'}">${statusTxt}</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                `;

                tbody.appendChild(tr);
              }

            });

          })
          .catch(err => {
            console.error(err);
            alert("Erro ao carregar relatório.");
          });
      }

      function excluirBaixa(id) {

        if (!confirm("Deseja realmente excluir esta baixa?")) return;

        fetch('/financeiro/api/pagamento/' + id, {
          method: 'DELETE'
        })
          .then(res => {
            if (!res.ok) throw new Error("Erro ao excluir");
            alert("Baixa excluída com sucesso!");
            carregarRelatorio();
          })
          .catch(err => {
            console.error(err);
            alert("Erro ao excluir baixa.");
          });
      }
      window.onload = function () {
        carregarClientes();
        carregarFormasPagamento();
        carregarRelatorio();
      };



      function carregarFormasPagamento() {
        fetch('/financeiro/api/formas-pagamento')
          .then(res => {
            if (!res.ok) throw new Error("Erro ao buscar formas");
            return res.json();
          })
          .then(formas => {

            const select = document.getElementById('formaPagamento');
            select.innerHTML = '<option value="">Todas Formas</option>';

            formas.forEach(forma => {
              const opt = document.createElement('option');
              opt.value = forma;
              opt.textContent = formatarForma(forma);
              select.appendChild(opt);
            });

          })
          .catch(err => {
            console.error("Erro ao carregar formas:", err);
          });
      }

      function formatarForma(forma) {
        return forma
          .toLowerCase()
          .replaceAll('_', ' ')
          .replace(/\b\w/g, l => l.toUpperCase());
      }



    </script>

    <div class="actions">
      <button onclick="window.location.href='/dashboard'">Voltar </button>
    </div>

  </div>
</body>

</html>
